name: Проверки HoneyForge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: honeyforge_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-test-only@localhost:5432/honeyforge_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-test-only@localhost:5432/honeyforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python -m alembic upgrade head && python -m alembic check
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts
      - run: for file in frontend/*.js; do node --check "$file"; done
      - run: npm run test:i18n
      - run: python infrastructure/scripts/audit_localization.py
  compose-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python infrastructure/scripts/setup.py
      - run: docker compose config --quiet
      - run: echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)" >> .env
      - run: python infrastructure/scripts/demo.py
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: compose-log, path: compose.log}
      - if: always()
        run: |
          docker ps -aq --filter label=io.honeyforge.managed=true | xargs -r docker rm -f
          docker compose down
